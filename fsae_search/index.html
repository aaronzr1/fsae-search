<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>FSAE Rule Search</title><style>
:root {color-scheme:light; --ink:#172b29; --muted:#63736f; --line:#dce3df; --accent:#12654f; --paper:#f6f8f5;}
* {box-sizing:border-box} body {margin:0;background:var(--paper);color:var(--ink);font:15px/1.55 system-ui,sans-serif}
main {max-width:1080px;margin:auto;padding:40px 28px} header {display:flex;justify-content:space-between;gap:24px;align-items:start;margin-bottom:32px}
h1 {font-size:30px;letter-spacing:-1px;margin:3px 0 6px} h2 {font-size:19px;margin:0} p {margin:6px 0} .eyebrow {font-size:11px;letter-spacing:1.7px;font-weight:700;color:var(--accent)}
.muted {color:var(--muted)} .small {font-size:13px} a {color:var(--accent);text-underline-offset:3px} .edition {text-align:right;font-size:13px;max-width:330px}
.search {background:white;border:1px solid var(--line);padding:24px;margin-bottom:22px} label {display:block;font-weight:600;font-size:13px;margin-bottom:7px}
input,select,button {font:inherit;border-radius:3px} input[type=text] {width:100%;padding:13px;border:1px solid #becbc4;background:white}
input:focus,select:focus {outline:2px solid #a5cabb;outline-offset:1px} .controls {display:flex;gap:12px;margin-top:15px;align-items:end;flex-wrap:wrap}
select {padding:8px;border:1px solid #becbc4;background:white} button {cursor:pointer;padding:9px 16px;border:1px solid var(--line);background:white;color:var(--ink)}
button.primary {background:var(--accent);color:white;border-color:var(--accent)} button:disabled {opacity:.5;cursor:default} .controls .spacer {flex:1}
.samples {display:flex;gap:8px;flex-wrap:wrap;margin-top:15px} .samples button {font-size:12px;padding:5px 10px;background:var(--paper)}
#message {margin-bottom:16px} .error {color:#9a342c} .progress {width:100%;height:6px;background:var(--line);margin:12px 0} .progress span {display:block;height:100%;background:var(--accent)}
.stats {display:flex;gap:24px;flex-wrap:wrap;padding:14px 0 22px;border-bottom:1px solid var(--line);margin-bottom:22px}.stats strong {display:block;font-size:19px;font-weight:600}.stats span {font-size:12px;color:var(--muted)}
.result {background:white;border:1px solid var(--line);padding:20px;margin:12px 0} .result-head {display:flex;align-items:start;justify-content:space-between;gap:20px} .rule-id {font-weight:700;color:var(--accent)}
.crumb {font-size:12px;color:var(--muted);margin:6px 0 12px}.text {white-space:pre-wrap;line-height:1.65;font-size:14px;margin:8px 0;overflow-wrap:anywhere}.note {background:#faf4e7;padding:8px 12px;font-size:12px;margin:12px 0}
.actions {display:flex;align-items:center;gap:15px;margin-top:14px;font-size:13px}.actions button {padding:0;border:0;color:var(--accent);font-size:13px;text-decoration:underline}
.score {font-size:13px;color:var(--muted);white-space:nowrap} details {margin-top:25px} summary {cursor:pointer;font-weight:600} .related .result {background:transparent}
@media(max-width:650px) {main {padding:24px 16px} header {display:block} .edition {text-align:left;margin-top:16px}.controls {align-items:start}.controls .spacer {display:none}h1 {font-size:26px}}
</style></head><body><main>
<header><div><div class="eyebrow">FORMULA SAE / RULEBOOK EXPLORER</div><h1>Find the rules you need.</h1><p class="muted">Search across sections. Read the source in context.</p></div><div class="edition" id="edition"></div></header>
<section class="search"><form id="form"><label for="query">What are you looking for?</label><input id="query" type="text" maxlength="2000" placeholder="What are the rules on brakes?" required autocomplete="off">
<div class="controls"><div><label for="mode">Search method</label><select id="mode"><option value="jev">Jev semantic search</option><option value="local">Local text search · free</option></select></div>
<div><label for="strategy">Coverage</label><select id="strategy"><option value="sections">Whole rulebook · complete sections</option><option value="routed">Fast routed · selected sections</option><option value="rules">Original · individual rules</option></select></div>
<div><label for="vehicle">Vehicle context</label><select id="vehicle"><option value="all">All vehicles</option><option value="EV">Electric vehicle</option><option value="IC">Internal combustion</option></select></div>
<div><label for="count">Results</label><select id="count"><option>50</option><option>100</option><option>200</option><option value="2000">All matches</option></select></div>
<div class="spacer"></div><button id="estimate" type="button">Estimate usage</button><button class="primary" id="submit">Search rules</button></div>
<div class="samples"><button type="button" data-query="What are the rules on brakes?">Brakes</button><button type="button" data-query="What are the requirements for an EV shutdown circuit?">EV shutdown</button><button type="button" data-query="What are the cockpit opening and driver egress requirements?">Cockpit &amp; egress</button><button type="button" data-query="T.3.3">Find rule T.3.3</button></div>
</form><p class="small muted" id="ready" style="margin-top:14px"></p></section>
<div id="message" role="status" aria-live="polite"></div><div id="stats"></div><div id="results"></div><div id="related"></div>
</main><script>
const $=s=>document.querySelector(s); let active=false;
function element(tag,text,cls) {const el=document.createElement(tag);if(text!==undefined)el.textContent=text;if(cls)el.className=cls;return el}
async function api(path,body) {const r=await fetch(path,body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:{});const data=await r.json();if(!r.ok)throw new Error(typeof data.detail==='string'?data.detail:'Check your query and try again.');return data}
function request() {return {query:$('#query').value.trim(),vehicle_type:$('#vehicle').value,top_k:Number($('#count').value),strategy:$('#strategy').value}}
function message(text,error=false) {$('#message').textContent=text;$('#message').className=error?'error':''}
function busy(value) {active=value;$('#submit').disabled=value;$('#estimate').disabled=value}
function stat(label,value) {const el=element('div');el.append(element('strong',value),element('span',label));return el}
function card(r) {const el=element('article',undefined,'result'),head=element('div',undefined,'result-head'),title=element('div');title.append(element('span',r.rule_id,'rule-id'));if(r.title)title.append(element('span',' · '+r.title));head.append(title);if(r.probability!==undefined)head.append(element('span',Math.round(r.probability*100)+'% relevance','score'));el.append(head,element('div',r.breadcrumb,'crumb'),element('div',r.text||'This entry is a heading. Open its section to read the numbered rules.','text'));
if(r.has_visual_content)el.append(element('div',r.visual_note||'This rule includes visual details. Refer to the source PDF.','note'));
if(r.via)el.append(element('div','Referenced by '+r.via.join(', '),'small muted'));
const actions=element('div',undefined,'actions'),link=element('a','PDF · page '+r.page_start+(r.page_end>r.page_start?'–'+r.page_end:''));link.href=r.pdf_url;link.target='_blank';link.rel='noopener';actions.append(link);const context=element('button',r.score_scope==='section'?'Read article':'Read section');context.onclick=async()=>{try{const id=r.kind==='table'?r.rule_id:r.rule_id.split('.').slice(0,Math.min(r.score_scope==='section'?2:3,r.rule_id.split('.').length)).join('.');const v=await api('/api/rules/'+encodeURIComponent(id));const details=element('details');details.open=true;details.append(element('summary',v.rule_id+' · '+(v.title||'Section')),element('div',v.text,'text'));el.append(details);context.remove()}catch(e){message(e.message,true)}};actions.append(context);el.append(actions);return el}
function render(data) {$('#results').replaceChildren();$('#related').replaceChildren();$('#stats').replaceChildren();const stats=element('div',undefined,'stats');stats.append(stat(data.score_scope==='section'?'Matching sections':'Matching entries',String(data.total_matches)),stat('Shown',String(data.results.length)));if(data.score_scope==='section')stats.append(stat('Rules in matching sections',String(data.matched_rule_count)));
if(data.mode==='jev'){stats.append(stat('Time',data.seconds+' s'),stat('Input tokens',data.usage?data.usage.input_tokens.toLocaleString():'Unavailable'),stat('Reported cost',data.cost_usd!==null?'$'+data.cost_usd.toFixed(5):data.known_reported_cost_usd!==null?'≥ $'+data.known_reported_cost_usd.toFixed(5):'Unavailable'));}
else stats.append(stat('Search cost','$0 · local'));$('#stats').append(stats);
if(!data.complete)message('Partial results: '+data.errors+' evaluations failed. Reported cost may omit failed attempts.',true);else message(data.results.length?'':'No matches found. Try a broader description.');
for(const r of data.results)$('#results').append(card(r));if(data.complete&&data.cache_hit)message('Reused a saved scan for this exact query · no Jev charge.');else if(data.complete&&data.mode==='jev')message(data.full_rulebook_scan?'Every text search unit was included. Section scores preserve all numbered clauses.':'Routed search checked '+data.source_units_checked+' of '+data.source_units_total+' text units. Use whole-rulebook coverage for a complete scan.');
if(data.uncertain?.length){const d=element('details');d.append(element('summary','Lower-confidence sections ('+data.uncertain.length+')'),element('p','These sections scored below the main threshold and may contain relevant context. No additional Jev request is needed.','small muted'));let loaded=false;d.ontoggle=()=>{if(d.open&&!loaded){loaded=true;for(const r of data.uncertain)d.append(card(r))}};$('#related').append(d)}
if(data.source_matches?.length){const d=element('details');d.append(element('summary','Additional source matches · independent keyword check ('+data.source_matches.length+')'),element('p','Original source sections found by terms and engineering synonyms, even when Jev scored them low. These are source matches, not extra model judgments.','small muted'));let loaded=false;d.ontoggle=()=>{if(d.open&&!loaded){loaded=true;for(const r of data.source_matches)d.append(card(r))}};$('#related').append(d)}
if(data.related.length){const details=element('details',undefined,'related');details.append(element('summary','Related rules and references ('+data.related.length+')'),element('p','These entries are linked from the matches above; they are not additional ranked matches.','small muted'));for(const r of data.related)details.append(card(r));$('#related').append(details)}}
$('#form').onsubmit=async e=>{e.preventDefault();if(active)return;const body=request();if(!body.query)return;busy(true);message('Searching rules…');try{if($('#mode').value==='local'){render(await api('/api/local-search',body));}else{const job=await api('/api/searches',body);if(job.status==='done'){render(job.output);}else while(true){const state=await api('/api/searches/'+job.id);if(state.status==='done'){render(state.output);break}if(state.status==='error')throw new Error(state.error);$('#message').replaceChildren(element('div','Checked '+state.completed+' of '+state.total+' entries'));const bar=element('div',undefined,'progress'),fill=element('span');fill.style.width=(state.completed/state.total*100)+'%';bar.append(fill);$('#message').append(bar);await new Promise(resolve=>setTimeout(resolve,650));}}}catch(e){message(e.message,true)}finally{busy(false)}};
$('#estimate').onclick=async()=>{try{const body=request();if(!body.query){$('#query').focus();return}const p=await api('/api/plan',body);message(p.comparisons+' entries · '+p.batch_count+' batches · '+p.concurrency+' concurrent requests · approximately '+p.estimated_input_tokens.toLocaleString()+' input tokens / $'+p.estimated_cost_usd.toFixed(4)+'. Rough estimate; no Jev requests sent.')}catch(e){message(e.message,true)}};
for(const button of document.querySelectorAll('[data-query]'))button.onclick=()=>{$('#query').value=button.dataset.query;if(button.dataset.query==='T.3.3')$('#mode').value='local';$('#query').focus()};
api('/api/status').then(s=>{$('#edition').append(element('div',s.document.title),element('div',s.rules.toLocaleString()+' numbered entries · '+s.search_units.toLocaleString()+' search units','muted'));const a=element('a','Open rulebook');a.href='/pdf/'+s.document.sha256;a.target='_blank';$('#edition').append(a);$('#ready').textContent=s.jev_configured?'Jev is ready. Whole-rulebook scans preserve complete sections. Repeated exact queries reuse the shared cache at no cost.':'Local search is ready. Add JEV_KEY to .env to enable Jev semantic search.';if(!s.jev_configured)$('#mode').value='local'}).catch(e=>message(e.message,true));
</script></body></html>
